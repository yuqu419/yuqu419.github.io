baseURL = 'https://yuqu419.github.io/'
locale = 'zh-CN'
title = 'yu419'
theme = 'FixIt'

[taxonomies]
_merge = "shallow"

[outputs]
home = ["html", "rss", "archives", "search", "offline", "manifest", "link"]

[[menus.main]]
identifier = "archives"
name = "归档"
url = "archives/"
weight = 1
params = { icon = "" }

[[menus.main]]
identifier = "categories"
name = "分类"
url = "categories/"
weight = 2
params = { icon = "" }

[[menus.main]]
identifier = "tags"
name = "标签"
url = "tags/"
weight = 3
params = { icon = "" }

[[menus.main]]
identifier = "about"
name = "关于我"
url = "about/"
weight = 4
params = { icon = "" }

[[menus.main]]
identifier = "github"
name = "GitHub"
url = "https://github.com/yuqu419"
weight = 5
params = { icon = "" }

[params.header]
blur = true

[params.header.title]
logo = 'images/avatar.jpg'

[params.app]
svg_favicon = '/favicon.png'

[params.home.profile]
enable = true
# 标题：短句 + 留白，比长句高级
title = 'Less, but better.'
subtitle = '记录技术、生活与思考'
typeit = true
social = false
contribution = false

[params.home.posts]
columns = 1

# ===== 图片相关 =====
[params.page]
# 文章默认封面（没写 front matter 时兜底）
defaultFeaturedImage = '/images/default-cover.jpg'
# 封面图悬停/预览
featuredImagePreview = true

[params.footer]
since = 2024